---
jobs:
  fuzz:
    name: '${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Perl 5.40
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: 5.40
      - name: Install dependencies
        run: |
          cpanm --notest -q Module::Build::Tiny
          perl Build.PL
          perl Build
      - env:
          MINUTES: '${{ inputs.minutes }}'
        name: Run fuzzer
        run: |
          FUZZ_TIME="${MINUTES:-10}"
          perl -Ilib bin/fuzz_runner.pl --time-limit $(( FUZZ_TIME * 60 ))
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
name: Fuzz
on:
  schedule:
    - cron: 0 6 * * *
  workflow_dispatch:
    inputs:
      minutes:
        default: 10
        description: Fuzzing time per runner
        required: false
        type: number
permissions:
  contents: read
