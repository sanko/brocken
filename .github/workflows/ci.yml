---
jobs:
  dragonflybsd:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'dragonflybsd' }}
    name: DragonFly BSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      test_files: ${{ needs.setup.outputs.test_files }}
      gcc_pkg: sudo pkg install -y gcc
      host: ubuntu-latest
      os: dragonflybsd
      perl: 5.42
      pkg: sudo pkg install -y perl5-5.42 || (sudo sed -i '' 's|/quarterly|/latest|' /usr/local/etc/pkg/repos/Avalon.conf && sudo pkg update -f && sudo pkg install -y perl5-5.42) || (curl -sL https://www.cpan.org/src/5.0/perl-5.42.2.tar.gz | tar xz -C /tmp && cd /tmp/perl-5.42.2 && ./Configure -des -Dprefix=/usr/local -Dusedevel && make -j$(getconf NPROCESSORS_ONLN) && sudo make install && sudo ln -sf /usr/local/bin/perl5.42.2 /usr/local/bin/perl)
      setup: export LC_ALL=C LANG=C LC_CTYPE=C LC_NUMERIC=C LC_COLLATE=C LC_TIME=C LC_MESSAGES=C LC_MONETARY=C; sudo pkg install -y gdb p5-Test-Harness || true
      version: 6.4.2
  freebsd-arm64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'freebsd' }}
    name: FreeBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: arm64
      test_files: ${{ needs.setup.outputs.test_files }}
      gcc_pkg: sudo pkg install -y gcc
      host: ubuntu-latest
      os: freebsd
      perl: 5.42
      pkg: sudo pkg install -y perl5
      version: 15.1
  freebsd-x64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'freebsd' }}
    name: FreeBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      test_files: ${{ needs.setup.outputs.test_files }}
      gcc_pkg: sudo pkg install -y gcc
      host: ubuntu-latest
      os: freebsd
      perl: 5.42
      pkg: sudo pkg install -y perl5
      version: 15.1
  haiku:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'haiku' }}
    name: Haiku
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      gcc_pkg: sudo pkgman install gcc || sudo pkgman install gcc_x86
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: haiku
      perl: 5.42
      perl_subversion: 2
      pkg: sudo pkgman install "perl>=5.42.2" -y || echo "perl 5.42 not available"
      version: r1beta5
  linux-arm64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'linux' }}
    name: Linux
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: ubuntu-24.04-arm
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: ARM
  linux-x64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'linux' }}
    name: Linux
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: ubuntu-24.04
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: Intel
  macos-arm:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'macos' }}
    name: macOS
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: macos-15
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: Apple Silicon
  macos-intel:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'macos' }}
    name: macOS
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: macos-15-intel
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: Intel
  midnightbsd:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'midnightbsd' }}
    name: MidnightBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      gcc_pkg: sudo mport install gcc || true
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: midnightbsd
      perl: 5.42
      pkg: sudo mport install perl5.42-5.42.2 || true; sudo ln -sf /usr/local/bin/perl5.42.2 /usr/local/bin/perl
      version: 4.0.4
  netbsd-arm64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'netbsd' }}
    name: NetBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: arm64
      gcc_pkg: which gcc 2>/dev/null || sudo pkgin -y install gcc || true
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: netbsd
      perl: 5.42
      pkg: sudo pkgin -y install perl || true
      version: 10.1
  netbsd-x64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'netbsd' }}
    name: NetBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      gcc_pkg: which gcc 2>/dev/null || sudo pkgin -y install gcc || true
      host: ubuntu-latest
      os: netbsd
      perl: 5.42
      pkg: sudo pkgin -y install perl || true
      setup: sudo pkgin -y install gdb || true
      test_files: ${{ needs.setup.outputs.test_files }}
      version: 10.1
  omnios:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'omnios' }}
    name: OmniOS
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      gcc_pkg: sudo pkg install developer/gcc --accept || sudo pkg install developer/gcc11 --accept || sudo pkg install gcc --accept || sudo pkg install developer/gcc49 --accept || true
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: omnios
      perl: 5.42
      pkg: 'sudo pkg install perl || [ $? -eq 4 ]'
      version: r151058
  openbsd-arm64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'openbsd' }}
    name: OpenBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: arm64
      gcc_pkg: which gcc 2>/dev/null || true
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: openbsd
      perl: 5.40
      perl_subversion: 1
      pkg: echo "using system perl"
      version: 7.9
  openbsd-x64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'openbsd' }}
    name: OpenBSD
    needs:
      - setup
    uses: ./.github/workflows/cross.yml
    with:
      arch: x86-64
      gcc_pkg: which gcc 2>/dev/null || true
      test_files: ${{ needs.setup.outputs.test_files }}
      host: ubuntu-latest
      os: openbsd
      perl: 5.40
      perl_subversion: 1
      pkg: echo "using system perl"
      version: 7.9
  publish-status:
    if: ( success() || failure() ) && github.ref == 'refs/heads/main'
    name: Publish Status Page
    needs:
      - results
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download status files
        uses: actions/download-artifact@v8.0.1
        with:
          name: status-files
          path: ./status
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          commit_message: Update build status matrix
          destination_dir: status
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          keep_files: true
          publish_branch: gh-pages
          publish_dir: ./status
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
  results:
    if: always()
    name: Summary
    needs:
      - linux-x64
      - linux-arm64
      - riscv64
      - macos-intel
      - macos-arm
      - win32-x64
      - win32-arm64
      - dragonflybsd
      - freebsd-x64
      - freebsd-arm64
      - haiku
      - midnightbsd
      - netbsd-x64
      - netbsd-arm64
      - omnios
      - openbsd-x64
      - openbsd-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all test output artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: results
      - name: Generate summary from test results
        run: |
          mkdir -p status
          SUMMARY_MD="status/status.md"
          STATUS_JSON="status/status.json"
          echo "## Build and Test Summary" > $SUMMARY_MD
          echo "| OS | Architecture | Result |" >> $SUMMARY_MD
          echo "|:---|:---|:---|" >> $SUMMARY_MD
          echo "{" > $STATUS_JSON
          first=true
          
          # All expected (OS, Arch) pairs in display order
          EXPECTED=(
            "Linux:Intel"
            "Linux:ARM"
            "Linux:RISC-V"
            "macOS:Intel"
            "macOS:Apple Silicon"
            "Windows:Intel"
            "Windows:ARM"
            "DragonFly BSD:Intel"
            "FreeBSD:Intel"
            "FreeBSD:ARM"
            "Haiku:Intel"
            "MidnightBSD:Intel"
            "NetBSD:Intel"
            "NetBSD:ARM"
            "OmniOS:Intel"
            "OpenBSD:Intel"
            "OpenBSD:ARM"
          )
          
          # Map artifact dir name → OS:Arch key
          map_name() {
            case "$1" in
              *"ubuntu-24.04-arm"*)   echo "Linux:ARM" ;;
              *"ubuntu-24.04-riscv"*) echo "Linux:RISC-V" ;;
              *"ubuntu-24.04"*)       echo "Linux:Intel" ;;
              *"macos-15-intel"*)    echo "macOS:Intel" ;;
              *"macos-15"*)          echo "macOS:Apple Silicon" ;;
              *"windows-11-arm"*)    echo "Windows:ARM" ;;
              *"windows-2022"*)      echo "Windows:Intel" ;;
              *"dragonflybsd"*)      echo "DragonFly BSD:Intel" ;;
              *"freebsd"*"arm64"*)   echo "FreeBSD:ARM" ;;
              *"freebsd"*)           echo "FreeBSD:Intel" ;;
              *"haiku"*)             echo "Haiku:Intel" ;;
              *"midnightbsd"*)       echo "MidnightBSD:Intel" ;;
              *"netbsd"*"arm64"*)    echo "NetBSD:ARM" ;;
              *"netbsd"*)            echo "NetBSD:Intel" ;;
              *"omnios"*)            echo "OmniOS:Intel" ;;
              *"openbsd"*"arm64"*)   echo "OpenBSD:ARM" ;;
              *"openbsd"*)           echo "OpenBSD:Intel" ;;
            esac
          }
          
          declare -A SEEN
          for entry in "${EXPECTED[@]}"; do
            SEEN["$entry"]=0
          done
          
          if [ -d "results" ]; then
            for dir in results/*/; do
              name=$(basename "$dir")
              key=$(map_name "$name")
              [ -z "$key" ] && continue
              file=$(find "$dir" -name "*.txt" | head -1)
              if [ -n "$file" ]; then
                if grep -q "^Error!" "$file"; then
                  SEEN["$key"]="failure"
                else
                  SEEN["$key"]="success"
                fi
              fi
            done
          fi
          
          for entry in "${EXPECTED[@]}"; do
            IFS=':' read -r os arch <<< "$entry"
            status="${SEEN[$entry]}"
            case "$status" in
              "success") icon="✅" ;;
              "failure") icon="❌" ;;
              *)         icon="❌"; status="failure" ;;
            esac
            echo "| $os | $arch | $icon |" >> $SUMMARY_MD
            [ "$first" = false ] && echo "," >> $STATUS_JSON
            echo "\"${os// /_}:$arch\": \"$status\"" >> $STATUS_JSON
            first=false
          done
          
          echo "}" >> $STATUS_JSON
          cat $SUMMARY_MD >> $GITHUB_STEP_SUMMARY
      - name: Upload status files for publishing
        uses: actions/upload-artifact@v7.0.1
        with:
          name: status-files
          path: status/
  riscv64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'riscv64' }}
    name: Linux
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: ubuntu-24.04-riscv
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: RISC-V
  setup:
    name: Generate Testing Matrix
    outputs:
      matrix: '${{ steps.matrix.outputs.matrix }}'
      runner: '${{ steps.parse_tags.outputs.runner }}'
      test_files: '${{ steps.parse_tags.outputs.test_files }}'
    runs-on: ubuntu-22.04
    steps:
      - name: Parse commit message tags for runner/test filtering
        id: parse_tags
        env:
          DISPATCH_RUNNER: ${{ github.event.inputs.runner }}
          DISPATCH_TEST: ${{ github.event.inputs.test_files }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.body || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "runner=${DISPATCH_RUNNER:-all}" >> "$GITHUB_OUTPUT"
            echo "test_files=${DISPATCH_TEST:-}" >> "$GITHUB_OUTPUT"
          else
            RUNNER=$(echo "$COMMIT_MSG" | grep -oP '\[runner:\K[^\]]+' || echo "all")
            TEST=$(echo "$COMMIT_MSG" | grep -oP '\[test:\K[^\]]+' || echo "")
            echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
            echo "test_files=$TEST" >> "$GITHUB_OUTPUT"
          fi
      - env:
          DATA: |
            {
              "perl":  ["5.42.0"],
              "flags": [""]
            }
        id: matrix
        run: "jq -rn 'env.DATA | fromjson | @json \"matrix=\\(.)\"' > $GITHUB_OUTPUT\n"
  wasm:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'linux' }}
    name: WebAssembly
    needs:
      - setup
    uses: ./.github/workflows/unix.yml
    with:
      flags: '${{ fromJSON(needs.setup.outputs.matrix).flags[0] }}'
      os: ubuntu-24.04
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: WebAssembly
  win32-arm64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'windows' }}
    name: Windows
    needs:
      - setup
    uses: ./.github/workflows/windows.yml
    with:
      flags: -Dusethreads
      os: windows-11-arm
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: ARM
  win32-x64:
    if: ${{ needs.setup.outputs.runner == 'all' || needs.setup.outputs.runner == 'windows' }}
    name: Windows
    needs:
      - setup
    uses: ./.github/workflows/windows.yml
    with:
      flags: -Dusethreads
      os: windows-2022
      perl: '${{ fromJSON(needs.setup.outputs.matrix).perl[0] }}'
      test_files: ${{ needs.setup.outputs.test_files }}
      title: Intel
name: CI Matrix
on:
  pull_request: ~
  push: ~
  schedule:
    - cron: 42 5 * * 0
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner(s) to execute (or "all")'
        type: choice
        options:
          - all
          - dragonflybsd
          - freebsd
          - linux
          - macos
          - windows
          - netbsd
          - openbsd
          - haiku
          - midnightbsd
          - omnios
          - riscv64
        default: all
      test_files:
        description: 'Test file pattern (e.g. t/3000_jenny/3500_isolate/*.t)'
        type: string
        default: ''
permissions:
  actions: read
  contents: read
