---
jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            host: ubuntu-latest
            os: openbsd
            perl: 5.40
            pkg: pkg_add perl
            version: 7.6
          - arch: arm64
            host: ubuntu-latest
            os: openbsd
            perl: 5.40
            pkg: pkg_add perl
            version: 7.6
          - arch: x86-64
            host: ubuntu-latest
            os: omnios
            perl: 5.40
            pkg: pkg install perl
            version: r151058
          - arch: x86-64
            host: ubuntu-latest
            os: haiku
            perl: 5.40
            pkg: pkgman install perl
            version: r1beta5
    uses: ./.github/workflows/cross.yml
    with:
      arch: '${{ matrix.arch }}'
      host: '${{ matrix.host }}'
      os: '${{ matrix.os }}'
      perl: '${{ matrix.perl }}'
      pkg: '${{ matrix.pkg }}'
      setup: |
        # Ensure tracing tools are installed if needed
        if [ "$(uname -s)" = "OpenBSD" ]; then sudo pkg_add truss; fi
        if [ "$(uname -s)" = "SunOS" ]; then # OmniOS usually has truss
             :
        fi
        if [ "$(uname -s)" = "Haiku" ]; then # Haiku may need a specific trace tool
             :
        fi
      test_cmd: |
        os=$(uname -s)
        if [ "$os" = "OpenBSD" ] || [ "$os" = "SunOS" ]; then
          truss -o debug.log perl -Ilib t/compiler/22_thread.t
        else
          # Assume Haiku uses strace or similar
          strace -o debug.log perl -Ilib t/compiler/22_thread.t
        fi
      version: '${{ matrix.version }}'
name: Debug Threading Issues
on:
  workflow_dispatch: ~
