---
name: CI Matrix

on:
  pull_request: ~
  push: ~
  schedule:
    - cron: '42 5 * * 0'
  # Manual runs may carry the same selectors as a commit tag, and win over it.
  workflow_dispatch:
    inputs:
      runner:
        default: all
        description: 'Runners to execute, comma-separated (e.g. "freebsd,linux" or "linux#aarch64,openbsd#x86_64"). See the [runner:...] tag below.'
        type: string
      test_files:
        default: ''
        description: Test file pattern to run (e.g. t/3000_jenny/3500_isolate/*.t)
        type: string
      feed:
        default: ''
        description: 'Machine-readable result feeds: "json", "rss", or "json,rss".'
        type: string

# One run per ref. Two pushes in a row otherwise race to publish the same
# artifacts and the older one wins the summary.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}'

permissions:
  actions: read
  contents: read

jobs:
  # A commit message (or a pull request title) may carry tags:
  #
  #   [runner:freebsd,linux#aarch64]   only these families run
  #   [test:t/3000_jenny/*.t]          only this test pattern runs
  #   [feed:json,rss]                  also publish machine-readable feeds
  #
  # Nothing in this file parses those. The reusable generate-matrix.yml does,
  # and the table below travels into it, so this file is only the per-family
  # wiring: which image to boot, what to run, and how results are titled.
  #
  # Note the tag vocabulary changed with the move off ./cross.yml: it used to be
  # [os:...] plus [arch:x64|arm|risc|wasm] and is now [runner:family#arch], where
  # arch is the real name (x86_64, aarch64, riscv64) and wasm is its own family.
  setup:
    name: Generate Testing Matrix
    uses: sanko/workflow-testing/.github/workflows/generate-matrix.yml@main
    with:
      runner: '${{ github.event.inputs.runner }}'
      test_files: '${{ github.event.inputs.test_files }}'
      feed: '${{ github.event.inputs.feed }}'
      # Brocken's own portfolio, replacing the built-in table. midnightbsd and
      # wasm are not built-in families and become selectable because the family
      # list is derived from these keys.
      #
      # A literal block scalar on purpose: this is never produced by an
      # expression, so the apostrophes in the omnios configure field are just
      # characters in a YAML file. Interpolating a table into this position
      # would put untrusted text inside a YAML document, which is how a single
      # quote ends the file early.
      #
      # One family per line, with a trailing comma. A line without its comma is
      # a JSON error that stops the run at this input before any job starts.
      #
      # perl_version is set only where the old CI built perl from source
      # (linux, macos, wasm, via perlbrew). The BSD and illumos legs used the
      # perl the VM image ships, so they leave it unset and install it in
      # prepare, and the report records the version actually found instead of a
      # hardcoded label.
      table: |
        {
          "dragonflybsd": [
            {"name":"Intel","platform_name":"dragonflybsd","os":"dragonflybsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -y perl5-5.42 || (sed -i '' 's|/quarterly|/latest|' /usr/local/etc/pkg/repos/Avalon.conf && pkg update -f && pkg install -y perl5-5.42) || (curl -sL https://www.cpan.org/src/5.0/perl-5.42.2.tar.gz | tar xz -C /tmp && cd /tmp/perl-5.42.2 && ./Configure -des -Dprefix=/usr/local -Dusedevel && make -j$(getconf NPROCESSORS_ONLN) && make install && ln -sf /usr/local/bin/perl5.42.2 /usr/local/bin/perl) || true; pkg install -y gcc curl gmake || true"}
          ],
          "freebsd": [
            {"name":"Intel","platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -y perl5 gcc curl"},
            {"name":"ARM","platform_name":"freebsd","os":"freebsd","arch":"aarch64","toolchain":"gcc","prepare":"pkg install -y perl5 gcc curl"}
          ],
          "haiku": [
            {"name":"Intel","platform_name":"haiku","os":"haiku","arch":"x86_64","toolchain":"gcc","prepare":"pkgman install -y cmd:gcc cmd:make cmd:curl cmd:wget cmd:perl || pkgman install -y cmd:gcc cmd:make cmd:curl cmd:perl cmd:gcc_x86"}
          ],
          "linux": [
            {"name":"Intel","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
            {"name":"ARM","arch":"aarch64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-arm","toolchain":"clang"},
            {"name":"RISC-V","arch":"riscv64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-riscv","toolchain":"gcc"}
          ],
          "macos": [
            {"name":"Apple Silicon","arch":"aarch64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15","toolchain":"clang"},
            {"name":"Intel","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15-intel","toolchain":"clang"}
          ],
          "midnightbsd": [
            {"name":"Intel","platform_name":"midnightbsd","os":"midnightbsd","arch":"x86_64","toolchain":"gcc","prepare":"mport install gcc || true; mport install perl5.42-5.42.2 || true; mport install curl || true; ln -sf /usr/local/bin/perl5.42.2 /usr/local/bin/perl || true"}
          ],
          "netbsd": [
            {"name":"Intel","platform_name":"netbsd","os":"netbsd","arch":"x86_64","toolchain":"gcc","prepare":"pkgin -y install perl || true; pkgin -y install gcc curl || true"},
            {"name":"ARM","platform_name":"netbsd","os":"netbsd","arch":"aarch64","toolchain":"gcc","prepare":"pkgin -y install perl || true; pkgin -y install gcc curl || true"}
          ],
          "omnios": [
            {"name":"Intel","platform_name":"omnios","os":"omnios","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -v --accept developer/gcc13 system/header developer/build/make web/curl || true; pkg install --accept perl || true"}
          ],
          "openbsd": [
            {"name":"Intel","platform_name":"openbsd","os":"openbsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg_add gmake curl || true"},
            {"name":"ARM","platform_name":"openbsd","os":"openbsd","arch":"aarch64","toolchain":"gcc","prepare":"pkg_add gmake curl || true"}
          ],
          "wasm": [
            {"name":"Intel","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc","prepare":"sudo apt-get update -y && sudo apt-get install -y nodejs; curl -fsSL --retry 3 -o /tmp/wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v32.0.1/wasmtime-v32.0.1-x86_64-linux.tar.xz && sudo tar -xJf /tmp/wasmtime.tar.xz -C /usr/local/bin --strip-components=1 wasmtime-v32.0.1-x86_64-linux/wasmtime && rm -f /tmp/wasmtime.tar.xz"}
          ],
          "windows": [
            {"name":"Intel","arch":"x86_64","platform_name":"windows","os":"windows-2022","variant":"5.42.3.1","toolchain":"gcc","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"},
            {"name":"ARM","arch":"aarch64","platform_name":"windows","os":"windows-11-arm","variant":"5.42.3.1","toolchain":"gcc","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"}
          ]
        }

  # Every family below is gated on its own name appearing in the padded `ready`
  # list, which generate-matrix.yml builds after applying both the family and the
  # arch filter. A family with no surviving setup is absent from `ready`, so an
  # empty matrix is never handed to a reusable workflow.
  #
  # The BSD and illumos families boot an image (run-vm); linux, macos, wasm and
  # windows take a hosted runner (run-direct). Which is which is the only real
  # difference between the two kinds of job.

  dragonflybsd:
    name: DragonFly BSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' dragonflybsd ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '6.4.2'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).dragonflybsd) }}
      task: |
        # Same shape as the old cross.yml, minus sudo: vmactions runs prepare
        # and run as root in the guest, so sudo is neither needed nor reliably
        # present.
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  freebsd:
    name: FreeBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' freebsd ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '15.1'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).freebsd) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  haiku:
    name: Haiku
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' haiku ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: 'r1beta5'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).haiku) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  linux:
    name: Linux
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' linux ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).linux) }}
      task: |
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        if [ -n "$TEST_FILES" ]; then
          prove -Ilib -lv $TEST_FILES
        else
          ./Build test --v
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  macos:
    name: macOS
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' macos ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).macos) }}
      task: |
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        if [ -n "$TEST_FILES" ]; then
          prove -Ilib -lv $TEST_FILES
        else
          ./Build test --v
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  midnightbsd:
    name: MidnightBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' midnightbsd ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '4.0.4'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).midnightbsd) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  netbsd:
    name: NetBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' netbsd ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '10.1'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).netbsd) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  omnios:
    name: OmniOS
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' omnios ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: 'r151058'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).omnios) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  openbsd:
    name: OpenBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' openbsd ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '7.9'
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).openbsd) }}
      task: |
        curl -L https://cpanmin.us | LC_ALL=C perl - --notest App::cpanminus Module::Build::Tiny
        export PATH="$PATH:$(perl -MConfig -e 'print $Config{installsitebin}'):$(perl -MConfig -e 'print $Config{installscript}')"
        LC_ALL=C cpanm --installdeps --notest .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          ./Build
          LC_ALL=C prove -Ilib -lv $TEST_FILES
        else
          LC_ALL=C cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  # Its own family rather than an arch of linux, so [runner:wasm] selects it
  # without dragging in the whole linux matrix.
  wasm:
    name: WebAssembly
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' wasm ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).wasm) }}
      task: |
        # The Wasm tests execute the modules the backend emits, so they skip
        # unless a runtime is on PATH, and a skip and a pass look alike in the
        # log. That is how this lane reports green without checking anything.
        # Prove the runtime works first, using the same invocation the tests
        # rely on (run --invoke main) against a module exporting main() -> i32
        # that returns 42, assembled here as raw bytes so the check does not
        # depend on Brocken being built. node is the tests' fallback when
        # wasmtime is absent, so require it too rather than let the suite fall
        # back silently.
        command -v wasmtime
        command -v node
        perl -e 'print pack "H*", join "", (
          "0061736d01000000",     # magic + version
          "0105016000017f",       # type: () -> (i32)
          "03020100",             # func 0
          "070801046d61696e0000", # export "main" -> func 0
          "0a06010400412a0b",     # code: i32.const 42; end
        )' > /tmp/smoke.wasm
        got=$(wasmtime run --invoke main /tmp/smoke.wasm)
        if [ "$got" != "42" ]; then
          echo "wasmtime smoke test returned '$got', expected 42" >&2
          exit 1
        fi
        echo "wasmtime smoke test returned 42"
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        if [ -n "$TEST_FILES" ]; then
          prove -Ilib -lv $TEST_FILES
        else
          ./Build test --v
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  windows:
    name: Windows
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' windows ') }}"
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      checkout_submodules: recursive
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).windows) }}
      # The harness runs the task under bash on every platform, including
      # Windows, so this is git-bash and not the pwsh the old windows.yml used.
      # That is also why ./Build becomes perl Build: the Build script's shebang
      # is not reliable on Windows.
      task: |
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        if [ -n "$TEST_FILES" ]; then
          perl Build.PL
          perl Build
          prove -Ilib -lv $TEST_FILES
        else
          cpanm --test-only -v .
        fi
      test_files: "${{ needs.setup.outputs.test_files }}"

  # if: always(), so a summary is published even when every build failed.
  #
  # `needs` lists setup as well as every family. setup is here for its outputs:
  # runner, test_files and feed all come from it, and a job that reads needs.X
  # must depend on X. A family that never started is reported as "not selected"
  # rather than silently missing.
  results:
    name: Summary
    if: always()
    needs:
      - setup
      - dragonflybsd
      - freebsd
      - haiku
      - linux
      - macos
      - midnightbsd
      - netbsd
      - omnios
      - openbsd
      - wasm
      - windows
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
    with:
      title: Brocken CI Matrix
      # These three let the report tell "filtered out of this run" apart from
      # "selected and reported nothing". Without them every silent family reads
      # as a failure.
      runner: "${{ needs.setup.outputs.runner }}"
      test_files: "${{ needs.setup.outputs.test_files }}"
      feed: "${{ needs.setup.outputs.feed }}"

  publish-status:
    if: ( success() || failure() ) && github.ref == 'refs/heads/main'
    name: Publish Status Page
    needs:
      - results
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download status files
        uses: actions/download-artifact@v8.0.1
        with:
          name: status-files
          path: ./status
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          commit_message: Update build status matrix
          destination_dir: status
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          keep_files: true
          publish_branch: gh-pages
          publish_dir: ./status
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
