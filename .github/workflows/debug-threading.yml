---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}'
jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            host: ubuntu-latest
            os: openbsd
            perl: 5.40
            pkg: pkg_add perl
            version: 7.8
          - arch: arm64
            host: ubuntu-latest
            os: openbsd
            perl: 5.40
            pkg: pkg_add perl
            version: 7.8
          - arch: x86-64
            host: ubuntu-latest
            os: omnios
            perl: 5.40
            pkg: pkg install --accept perl
            version: r151058
          - arch: x86-64
            host: ubuntu-latest
            os: haiku
            perl: 5.40
            pkg: pkgman install perl
            version: r1beta6
    uses: ./.github/workflows/cross.yml
    with:
      arch: '${{ matrix.arch }}'
      diag: |
        os=$(uname -s)
        if [ "$os" = "OpenBSD" ] || [ "$os" = "SunOS" ]; then
          truss -o trace.log perl -Ilib t/3000_jenny/3500_isolate/3501_isolate_runtime.t || true
        else
          strace -o trace.log perl -Ilib t/3000_jenny/3500_isolate/3501_isolate_runtime.t || true
        fi
      host: '${{ matrix.host }}'
      os: '${{ matrix.os }}'
      perl: '${{ matrix.perl }}'
      pkg: '${{ matrix.pkg }}'
      setup: |
        # Ensure tracing tools are installed if needed
        if [ "$(uname -s)" = "OpenBSD" ]; then sudo pkg_add truss; fi
        if [ "$(uname -s)" = "SunOS" ]; then # OmniOS usually has truss
             :
        fi
        if [ "$(uname -s)" = "Haiku" ]; then # Haiku may need a specific trace tool
             :
        fi
      test_files: t/3000_jenny/3500_isolate/3501_isolate_runtime.t t/3000_jenny/3500_isolate/3508_mn_threading.t t/3000_jenny/3400_fiber/3402_fiber_runtime.t
      version: '${{ matrix.version }}'
name: Debug Threading Issues
on:
  workflow_dispatch: ~
