name: Unified Tester

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner_type:
        required: true
        type: string
      os:
        required: true
        type: string
      os_version:
        required: false
        type: string
      arch:
        required: true
        type: string
      prepare:
        required: false
        type: string
      host_os:
        required: false
        type: string
      toolchain:
        required: true
        type: string

env:
  CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'

jobs:
  build-and-test:
    name: ${{ inputs.arch }}-${{ inputs.toolchain }}
    runs-on: ${{ inputs.host_os || inputs.os }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Setup MSVC
        if: inputs.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Setup Perl (Linux/macOS)
        if: inputs.runner_type == 'direct' && runner.os != 'Windows'
        uses: shogo82148/actions-setup-perl@v1.41.1
        with:
          perl-version: '5.40'

      - name: Setup Perl (Windows)
        if: inputs.runner_type == 'direct' && runner.os == 'Windows'
        run: |
          if perl -e 'exit ($^V ge v5.40.0 ? 0 : 1)' 2>/dev/null; then
            echo "Perl version is sufficient: $(perl -e 'print $^V')"
          else
            echo "Perl is old: $(perl -e 'print $^V')"
            echo "Trying different perl install method..."
            choco install strawberryperl -y || true
            echo "C:\Strawberry\perl\bin" >> $GITHUB_PATH 2>/dev/null || true
          fi
        shell: bash

      - name: Check Perl
        if: inputs.runner_type == 'direct'
        run: perl -v

      - name: Build and Test on Direct Runner
        if: inputs.runner_type == 'direct'
        run: |
          ${{ inputs.prepare }}
          perl eg/brocken.pl
          ls
        shell: bash

      - name: Build and Test in FreeBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            /usr/local/bin/perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      - name: Build and Test in OpenBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.0
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            /usr/local/bin/perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      - name: Build and Test in NetBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            /usr/local/bin/perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      - name: Build and Test in DragonflyBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.2.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            /usr/local/bin/perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      - name: Build and Test in Solaris
        if: inputs.runner_type == 'vm' && inputs.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.3
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            /usr/local/bin/perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      - name: Build and Test in OmniOS
        if: inputs.runner_type == 'vm' && inputs.os == 'omnios'
        uses: vmactions/omnios-vm@v1.3.0
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            export PATH=/usr/local/bin:$PATH
            perl eg/brocken.pl ${{ inputs.os }}-${{ inputs.arch }}

      #~ - name: Upload coverage reports to Codecov
        #~ uses: codecov/codecov-action@v6
        #~ with:
          #~ token: ${{ secrets.CODECOV_TOKEN }}
          #~ root_dir: src
          #~ flags: ${{inputs.os}}, ${{inputs.arch}}, ${{ inputs.toolchain }}
          #~ name: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          #~ verbose: true

      - name: Record Build Status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "success" > ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result
          else
            echo "failure" > ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result
          fi

      - name: Upload Build Status Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          path: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result
          retention-days: 1
