---
jobs:
  build:
    name: "${{ inputs.title != '' && inputs.title || (inputs.flags == '-Dusethreads' && 'Threads' || inputs.flags == '-Duselongdouble' && 'Long Double' || inputs.flags == '-Dusequadmath' && 'Quad Math' || inputs.flags == '--debug' && 'Debugging' || inputs.flags == '' && 'Default' || inputs.flags) }}"
    runs-on: '${{ inputs.os }}'
    steps:
      - name: Checkout source
        uses: actions/checkout@v5.0.0
        with:
          submodules: true
      - id: cache-perl
        name: Check perl Cache
        uses: actions/cache@v5.0.5
        with:
          key: '${{ inputs.os }}-perl-v${{ inputs.perl }}${{ inputs.flags }}'
          path: '~/perl5/'
          restore-keys: |
            ${{ inputs.os }}-perl-v${{ inputs.perl }}
            ${{ inputs.os }}-perl-
      - if: "${{ steps.cache-perl.outputs.cache-matched-key == '' }}"
        name: Install perlbrew toolchain
        run: |
          \curl -L https://install.perlbrew.pl | bash
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew self-upgrade
          perlbrew install-patchperl
          perlbrew install-cpanm
          cpanm --local-lib=~/perl5 local::lib && eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
          cpanm -n -v Devel::PatchPerl
      - if: "${{ steps.cache-perl.outputs.cache-hit != 'true' }}"
        name: 'Build perl ${{ inputs.perl }} from source'
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew install --switch --verbose --as cache-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }} -j 12 --notest --noman ${{ inputs.flags }} perl-${{ inputs.perl }}
      - name: Install prereqs
        run: |
          if [[ $(uname -o) == GNU/Linux ]]; then
            sudo apt-get update -y
            sudo apt-get install -y valgrind nodejs || true
            curl https://wasmtime.dev/install.sh -sSf | bash
            echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH
          fi
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew switch cache-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}
          cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        shell: bash
      - name: Set env vars from tag
        run: |
          if [ -n "${{ inputs.env_settings }}" ]; then
            for pair in ${{ inputs.env_settings }}; do
              export "$pair"
            done
          fi
        shell: bash
      - env:
          AUTHOR_TESTING: 0
          AUTOMATED_TESTING: 1
        id: test
        name: Run test suite
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew switch cache-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}
          perl -V
          perl Build.PL
          ./Build
          if [ -n "${{ inputs.test_files }}" ]; then
            if [ "${{ inputs.verbose_level }}" -ge 1 ] 2>/dev/null; then
              prove -Ilib -lv ${{ inputs.test_files }}
            else
              prove -Ilib -l ${{ inputs.test_files }}
            fi
          else
            if [ "${{ inputs.verbose_level }}" -ge 1 ] 2>/dev/null; then
              ./Build test --v
            else
              ./Build test
            fi
          fi
          command1_exit_code=$?
          if [ $command1_exit_code -eq 0 ]; then
            ~/perl5/perlbrew/perls/cache-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}/bin/perl -V > test-output-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}.txt
            command2_exit_code=$?
          else
            echo "Error!" > test-output-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}.txt
            exit $command1_exit_code
          fi
        shell: bash
      - continue-on-error: true
        if: always()
        name: Upload results as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: warn
          name: 'test-output-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}'
          path: 'test-output-${{ inputs.os }}-${{ inputs.perl }}${{ inputs.flags }}.txt'
          retention-days: 1
name: inputs module
on:
  workflow_call:
    inputs:
      env_settings:
        default: ''
        required: false
        type: string
      flags:
        required: false
        type: string
      os:
        required: true
        type: string
      perl:
        required: true
        type: string
      test_files:
        default: ''
        required: false
        type: string
      title:
        default: ''
        required: false
        type: string
      verbose_level:
        default: 0
        required: false
        type: string
