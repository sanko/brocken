---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}'
jobs:
  dragonflybsd:
    name: DragonFly BSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel", "platform_name":"dragonflybsd","os":"dragonflybsd","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.0","prepare":"pkg update && pkg upgrade -y && pkg install -y perl5 gcc gmake curl"}
        ]
      os_version: 6.4.0
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  freebsd:
    name: FreeBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -y perl5 curl"},
          {"name":"ARM","platform_name":"freebsd","os":"freebsd","arch":"aarch64","toolchain":"gcc","prepare":"pkg install -y perl5 curl"}
        ]
      os_version: 14.1
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  haiku:
    name: Haiku
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","platform_name":"haiku","os":"haiku","arch":"x86_64","toolchain":"gcc","prepare":"pkgman install -y cmd:gcc cmd:make cmd:curl cmd:wget cmd:perl"}
        ]
      os_version: r1beta6
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel [Ubuntu 26.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-26.04","toolchain":"gcc"},
          {"name":"Intel [Ubuntu 24.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"name":"Intel [Ubuntu 22.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-22.04","toolchain":"gcc"},
          {"name":"ARM [Ubuntu 26.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-26.04-arm","toolchain":"clang"},
          {"name":"ARM [Ubuntu 24.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-arm","toolchain":"clang"},
          {"name":"ARM [Ubuntu 22.04]","arch":"aarch64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-22.04-arm","toolchain":"clang"},
          {"name":"RISC-V [Ubuntu 24.04]","arch":"riscv64", "perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04-riscv","toolchain":"gcc"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via its canonical one-liner; on a writable perl (a
        #~ source build) it lands in the perl's own bin dir, which the runner
        #~ puts on PATH. Distro perl is read-only to the runner user, so
        #~ cpanm relocates every install into $HOME/perl5 instead. Adopt that
        #~ layout (PATH + local::lib env) so cpanm deps and the Build steps
        #~ share one module pool. No-op when $HOME/perl5 was never created.
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        if [ -x "$HOME/perl5/bin/cpanm" ]; then
          export PATH="$HOME/perl5/bin:$PATH"
          "$HOME/perl5/bin/cpanm" --local-lib="$HOME/perl5" --notest local::lib
          eval "$(perl -I "$HOME/perl5/lib/perl5" -Mlocal::lib)"
        fi
        command -v cpanm
        #~ A source-built perl is writable, so this first attempt installs straight
        #~ into it and nothing changes for those legs. The distro perl of the
        #~ ubuntu-26.04 default legs is not writable, and Affix::Build writes to
        #~ its site paths no matter what local::lib says, so when the plain
        #~ install fails, retry as root through the absolute cpanm path (sudo
        #~ resets PATH, so a bare name would not be found).
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v . \
          || sudo "$(command -v cpanm)" --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Apple Silicon","arch":"aarch64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15","toolchain":"clang"},
          {"name":"Intel","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"macos","os":"macos-15-intel","toolchain":"clang"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via its canonical one-liner; it installs into the
        #~ active (source-built) perl's bin dir, which the runner puts on PATH.
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  midnightbsd:
    name: MidnightBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"platform_name":"midnightbsd","os":"midnightbsd","arch":"x86_64","toolchain":"gcc","prepare":"mport install gcc || true; mport install perl5.42-5.42.2 || true; mport install curl || true; ln -sf /usr/local/bin/perl5.42.2 /usr/local/bin/perl || true"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  netbsd:
    name: NetBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","platform_name":"netbsd","os":"netbsd","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.0","prepare":"export PKG_PATH=https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/10.1/All && /usr/sbin/pkg_add perl curl gmake"},
          {"name":"ARM","platform_name":"netbsd","os":"netbsd","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.0","prepare":"export PKG_PATH=https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/10.1/All && /usr/sbin/pkg_add perl curl gmake"}
        ]
      os_version: 10.1
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  omnios:
    name: OmniOS
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"platform_name":"omnios","os":"omnios","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.0","configure":"-A'ccflags=-D__EXTENSIONS__ -fno-lto'","prepare":"pkg install -v --accept developer/gcc13 system/header developer/build/make web/curl"}
        ]
      os_version: r151050
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  openbsd:
    name: OpenBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","platform_name":"openbsd","os":"openbsd","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.0","prepare":"pkg_add gmake curl"},
          {"name":"ARM","platform_name":"openbsd","os":"openbsd","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.0","prepare":"pkg_add gmake curl"}
        ]
      os_version: 7.8
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere,
        #~ so re-export those dirs after bootstrapping.
        if command -v curl >/dev/null 2>&1; then curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        elif command -v wget >/dev/null 2>&1; then wget -qO /tmp/cpanmin.pl https://cpanmin.us
        elif command -v fetch >/dev/null 2>&1; then fetch -o /tmp/cpanmin.pl https://cpanmin.us
        else echo 'no http downloader available' >&2; exit 1; fi
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  publish-status:
    if: ( success() || failure() ) && github.ref == 'refs/heads/main'
    name: Publish Status Page
    needs:
      - results
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download status files
        uses: actions/download-artifact@v8.0.1
        with:
          name: status-files
          path: ./status
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          commit_message: Update build status matrix
          destination_dir: status
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          keep_files: true
          publish_branch: gh-pages
          publish_dir: ./status
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
  results:
    if: always()
    name: Results
    needs:
      - freebsd
      - linux
      - macos
      - openbsd
      - netbsd
      - dragonflybsd
      - midnightbsd
      - omnios
      - haiku
      - windows
      - wasm
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
    with:
      title: Brocken CI Matrix
  wasm:
    name: Wasm
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel [Ubuntu 26.04]","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-26.04","toolchain":"gcc","prepare":"curl -fsSL --retry 3 -o /tmp/wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v32.0.1/wasmtime-v32.0.1-x86_64-linux.tar.xz && sudo tar -xJf /tmp/wasmtime.tar.xz -C /usr/local/bin --strip-components=1 wasmtime-v32.0.1-x86_64-linux/wasmtime && rm -f /tmp/wasmtime.tar.xz && wasmtime --version"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        #~ The Wasm tests execute the modules the backend emits, so they skip
        #~ unless a runtime is on PATH. A skip and a pass look alike in the log,
        #~ which is how this lane used to report green without checking
        #~ anything. Prove the runtime works before trusting the suite, using
        #~ the same invocation the tests rely on (run --invoke main) against a
        #~ module exporting main() -> i32 that returns 42, assembled here as raw
        #~ bytes so the check does not depend on Brocken being built.
        command -v wasmtime
        perl -e 'print pack "H*", join "", (
          "0061736d01000000",     # magic + version
          "0105016000017f",       # type: () -> (i32)
          "03020100",             # func 0
          "070801046d61696e0000", # export "main" -> func 0
          "0a06010400412a0b",     # code: i32.const 42; end
        )' > /tmp/smoke.wasm
        got=$(wasmtime run --invoke main /tmp/smoke.wasm)
        if [ "$got" != "42" ]; then
          echo "wasmtime smoke test returned '$got', expected 42" >&2
          exit 1
        fi
        echo "wasmtime smoke test returned 42"
        #~ Same bootstrap the Linux legs use: distro perl is read-only to the
        #~ runner user, so cpanm relocates installs into $HOME/perl5 and that
        #~ layout has to be adopted before the dependency and Build steps.
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        if [ -x "$HOME/perl5/bin/cpanm" ]; then
          export PATH="$HOME/perl5/bin:$PATH"
          "$HOME/perl5/bin/cpanm" --local-lib="$HOME/perl5" --notest local::lib
          eval "$(perl -I "$HOME/perl5/lib/perl5" -Mlocal::lib)"
        fi
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v . \
          || sudo "$(command -v cpanm)" --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {"name":"Intel","arch":"x86_64","platform_name":"windows","os":"windows-2022",  "variant":"5.42.3.1","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"},
          {"name":"ARM","arch":"aarch64","platform_name":"windows", "os":"windows-11-arm","variant":"5.42.3.1","prepare":"curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"}
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=\$^X :: \$^O\n)'
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        cpanm --test-only -v .
name: CI Matrix
on:
  pull_request: ~
  push: ~
  schedule:
    - cron: 42 5 * * 0
  workflow_dispatch: ~
permissions:
  actions: read
  contents: read
