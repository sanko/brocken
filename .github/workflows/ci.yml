name: CI

on:
  pull_request: ~
  push: ~
  schedule:
    - cron: '42 5 * * 0'
  workflow_dispatch: ~

permissions:
  contents: read
  actions: read

jobs:

  vm:
    name:  ${{ matrix.platform.os }}-${{ matrix.arch }}
    uses: ./.github/workflows/unified-tester.yml
    secrets: inherit
    with:
      platform_name: ${{ matrix.platform.os }}
      runner_type: 'vm'
      os: ${{ matrix.platform.os }}
      os_version: ${{ matrix.platform.version }}
      arch: ${{ matrix.arch }}
      prepare:  ${{ matrix.platform.prepare }}
      host_os: 'ubuntu-latest'
      toolchain: 'none'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: 'freebsd'
            version: '15.0'
            prepare: 'pkg install -y perl5.40'
          - os: 'openbsd'
            version: '7.8'
            prepare: ''
          - os: 'netbsd'
            version: '10.1'
            prepare: 'pkgin -y install perl'
          - os: 'dragonflybsd'
            version: '6.4.0'
            prepare: 'pkg install -y perl5.40'
          - os: 'solaris'
            version: '11.4'
            prepare: 'pkg install -v --accept gcc make binutils; curl -L https://install.perlbrew.pl | bash; export PATH=$HOME/perl5/perlbrew/bin:$PATH; perlbrew install perl-5.40.0 --notest -j 4; perlbrew use perl-5.40.0'
          - os: 'omnios'
            version: 'r151056'
            prepare: 'pkg update; pkg install -v --accept runtime/perl-540 build-essential'
        arch: ['x86_64', 'aarch64']
        exclude:
          - platform: { os: 'dragonflybsd' }
            arch: 'aarch64'
          - platform: { os: 'solaris' }
            arch: 'aarch64'
          - platform: { os: 'omnios' }
            arch: 'aarch64'

  direct:
    name: ${{ matrix.platform.name }}-${{ matrix.platform.arch }}
    uses: ./.github/workflows/unified-tester.yml
    secrets: inherit
    with:
      platform_name: ${{ matrix.platform.name }}
      runner_type: 'direct'
      os: ${{ matrix.platform.os }}
      arch: ${{ matrix.platform.arch }}
      prepare: ${{ matrix.platform.prepare }}
      toolchain: 'none'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 'ubuntu'
            os: 'ubuntu-latest'
            arch: 'x86_64'
            prepare: 'sudo apt-get update'
          - name: 'macos'
            os: 'macos-15'
            arch: 'aarch64'
            prepare: ''
          - name: 'macos'
            os: 'macos-15-intel'
            arch: 'x86_64'
            prepare: ''
          - name: 'windows'
            os: 'windows-latest'
            arch: 'x86_64'
            prepare: ''
          - name: 'ubuntu'
            os: 'ubuntu-24.04-arm'
            arch: 'aarch64'
            prepare: 'sudo apt-get update'
          - name: 'windows'
            os: 'windows-11-arm'
            arch: 'aarch64'
            prepare: ''

  results:
    name: Summary
    if: always()
    needs: [vm, direct]
    runs-on: ubuntu-latest
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-artifact-*
          path: results/
          merge-multiple: true

      - name: Generate Job Summary from Artifacts
        run: |
          mkdir -p status
          SUMMARY_MD="status/status.md"
          STATUS_JSON="status/status.json"
          echo "## Build and Test Summary" > $SUMMARY_MD
          echo "| OS | Arch | Result |" >> $SUMMARY_MD
          echo "|:---|:---|:---|" >> $SUMMARY_MD
          echo "{" > $STATUS_JSON
          is_first_json_entry=true
          if [ -d "results" ] && [ -n "$(ls -A results)" ]; then
            find results -type f -name "*.result" | sort | while IFS= read -r file; do
              result=$(cat "$file")
              filename=$(basename "$file" .result)
              ICON=$([[ $result == 'success' ]] && echo '✅' || echo '❌')
              IFS='-' read -ra parts <<< "$filename"
              platform="${parts[0]}"
              arch="${parts[1]}"
              echo "| **$platform** | \`$arch\` | $ICON $result |" >> $SUMMARY_MD
              if [ "$is_first_json_entry" = false ]; then
                echo "," >> $STATUS_JSON
              fi
              SHIELD_STATUS=$([[ $result == 'success' ]] && echo '👍🏽 passing' || echo '👎🏽 failing')
              echo "\"$filename\": \"$SHIELD_STATUS\"" >> $STATUS_JSON
              is_first_json_entry=false
            done
          else
            echo "| All build jobs | | No result data found. ❌ |" >> $SUMMARY_MD
          fi
          echo "}" >> $STATUS_JSON
          cat $SUMMARY_MD >> $GITHUB_STEP_SUMMARY
      - name: Upload Status Artifact for Publishing
        uses: actions/upload-artifact@v4
        with:
          name: status-files
          path: status/
  publish-status:
    name: Publish Status Page
    if: ( success() || failure() ) && github.ref == 'refs/heads/main'
    needs: [results]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download status files
        uses: actions/download-artifact@v4
        with:
          name: status-files
          path: ./status

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./status
          publish_branch: gh-pages
          keep_files: true
          destination_dir: status
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update build status matrix'
